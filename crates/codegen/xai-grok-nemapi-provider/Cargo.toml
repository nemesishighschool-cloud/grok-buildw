[package]
name = "xai-grok-nemapi-provider"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "NemApi provider integration for Grok Build - replaces official xAI API with NemApi proxy"
authors = ["NemApi Integration Team"]

[dependencies]
# Workspace dependencies
xai-grok-sampling-types = { workspace = true }
xai-grok-sampler = { workspace = true }
xai-grok-models = { workspace = true }

# HTTP client
reqwest = { workspace = true, features = ["json", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
indexmap = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
futures-util = { workspace = true }
eventsource-stream = { workspace = true }

# For random API key generation
rand = { version = "0.8", features = ["std_rng"] }

# For timestamp handling
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
# For tests
mockito = { version = "1.4", features = ["serde_json"] }
tokio-test = "0.4"

[features]
default = []
testing = []

[lints]
workspace = true
