# Configuration de test pour l'intégration NemApi
# Ce fichier configure Grok Build pour utiliser uniquement NemApi comme fournisseur

[endpoints]
# Route default model inference directly to NemApi.
nemapi_base_url = "http://127.0.0.1:8090/v1"

[models]
# Utilise gemini-chat comme modèle par défaut
default = "gemini-chat"
